<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartBin AIoT - PTIT</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0fdf4;
            color: #1e293b;
            text-align: center;
            margin: 0;
            padding: 20px;
        }
        h1 {
            color: #166534;
        }
        #container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }
        #webcam-container {
            border: 5px solid #22c55e;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 10px 15px rgba(0,0,0,0.1);
        }
        #result-card {
            background: white;
            padding: 20px 40px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            font-size: 24px;
            font-weight: bold;
            min-width: 300px;
        }
        .confidence {
            font-size: 18px;
            color: #64748b;
            font-weight: normal;
            margin-top: 10px;
        }
        #stats-board {
            background: #ffffff;
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            min-width: 300px;
        }
        button {
            background-color: #16a34a;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 18px;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.3s;
        }
        button:hover {
            background-color: #15803d;
        }
    </style>
</head>
<body>

    <h1>🗑️ SmartBin AIoT</h1>
    <p>Hệ thống nhận diện & hướng dẫn phân loại rác thông minh</p>
    
    <button type="button" onclick="init()">Bật Camera & Bắt đầu Quét</button>
    
    <div id="container" style="margin-top: 20px;">
        <div id="webcam-container"></div>
        
        <div id="result-card">
            <div id="class-name">Đang chờ quét...</div>
            <div id="confidence-score" class="confidence">Confidence: 0%</div>
        </div>

        <div id="stats-board">
            <h3>📊 Thống kê phiên phân loại</h3>
            <p>Nhựa: <span id="stat-nhua">0</span></p>
            <p>Giấy: <span id="stat-giay">0</span></p>
            <p>Kim loại: <span id="stat-kimloai">0</span></p>
            <p>Nguy hại / Điện tử: <span id="stat-nguyhai">0</span></p>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest/dist/tf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@latest/dist/teachablemachine-image.min.js"></script>
    
    <script>
        // 
     const URL = "https://teachablemachine.withgoogle.com/models/eUC93yBYY/";
        let model, webcam, labelContainer, maxPredictions;
        let lastSpokenClass = ""; // Biến chống nói nhảm liên tục
        
        // Biến lưu trữ thống kê
        let stats = {
            "Nhựa": 0,
            "Giấy": 0,
            "Kim loại": 0,
            "Rác nguy hại": 0
        };

        async function init() {
            const modelURL = URL + "model.json";
            const metadataURL = URL + "metadata.json";

            // Load model
            model = await tmImage.load(modelURL, metadataURL);
            maxPredictions = model.getTotalClasses();

            // Setup Webcam
            const flip = true; 
            webcam = new tmImage.Webcam(400, 400, flip); 
            await webcam.setup(); 
            await webcam.play();
            window.requestAnimationFrame(loop);

            document.getElementById("webcam-container").appendChild(webcam.canvas);
        }

        async function loop() {
            webcam.update(); 
            await predict();
            window.requestAnimationFrame(loop);
        }

        async function predict() {
            const prediction = await model.predict(webcam.canvas);
            
            // Tìm ra loại rác có % dự đoán cao nhất
            let highestProb = 0;
            let bestClass = "";

            for (let i = 0; i < maxPredictions; i++) {
                if (prediction[i].probability > highestProb) {
                    highestProb = prediction[i].probability;
                    bestClass = prediction[i].className;
                }
            }

            // Chỉ xử lý nếu độ chính xác (Confidence Score) > 85%
            if (highestProb > 0.85) {
                document.getElementById("class-name").innerText = "Đã nhận diện: " + bestClass;
                document.getElementById("confidence-score").innerText = "Confidence Score: " + Math.round(highestProb * 100) + "%";

                // Chỉ phát giọng nói và cộng điểm thống kê nếu là món rác mới (khác Background)
                if (bestClass !== "Background" && bestClass !== lastSpokenClass) {
                    speakInstruction(bestClass);
                    updateStats(bestClass);
                    lastSpokenClass = bestClass; 
                } else if (bestClass === "Background") {
                    // Reset lại khi không có rác
                    lastSpokenClass = "Background";
                    document.getElementById("class-name").innerText = "Đang chờ rác...";
                }
            }
        }

        // Hàm phát giọng nói Text-to-Speech
        function speakInstruction(className) {
            let message = "";
            if (className.toLowerCase().includes("nhựa")) {
                message = "Đây là rác nhựa, vui lòng bỏ vào thùng màu vàng để tái chế.";
            } else if (className.toLowerCase().includes("giấy")) {
                message = "Đây là rác giấy, có thể tái chế, bỏ vào thùng màu xanh nhé.";
            } else if (className.toLowerCase().includes("kim loại")) {
                message = "Đây là kim loại, bỏ vào thùng màu vàng để tái chế.";
            } else if (className.toLowerCase().includes("nguy hại") || className.toLowerCase().includes("pin")) {
                message = "Cảnh báo, đây là rác nguy hại. Tuyệt đối không bỏ chung với rác sinh hoạt.";
            } else {
                message = "Vui lòng phân loại rác này vào thùng rác chung.";
            }

            let speech = new SpeechSynthesisUtterance(message);
            speech.lang = "vi-VN"; 
            speech.rate = 1.1; // Tốc độ đọc
            window.speechSynthesis.speak(speech);
        }

        // Hàm cập nhật bảng thống kê
        function updateStats(className) {
            if (className.toLowerCase().includes("nhựa")) stats["Nhựa"]++;
            else if (className.toLowerCase().includes("giấy")) stats["Giấy"]++;
            else if (className.toLowerCase().includes("kim loại")) stats["Kim loại"]++;
            else if (className.toLowerCase().includes("nguy hại") || className.toLowerCase().includes("pin")) stats["Rác nguy hại"]++;
            
            document.getElementById("stat-nhua").innerText = stats["Nhựa"];
            document.getElementById("stat-giay").innerText = stats["Giấy"];
            document.getElementById("stat-kimloai").innerText = stats["Kim loại"];
            document.getElementById("stat-nguyhai").innerText = stats["Rác nguy hại"];
        }
    </script>
</body>
</html>
