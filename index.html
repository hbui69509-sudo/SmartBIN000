<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartBin Kiosk - PTIT AI</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Be+Vietnam+Pro:wght@400;500;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest/dist/tf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@latest/dist/teachablemachine-image.min.js"></script>
    <!-- QR Code generator -->
    <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="header">
    <div class="header-left">
        <div class="logo-icon">♻</div>
        <div>
            <h1>SMARTBIN KIOSK</h1>
            <p class="subtitle">PTIT AI · Web Demo</p>
        </div>
    </div>
    <div class="header-right">
        <div class="status-wrap">
            <span class="status-dot" id="status-dot"></span>
            <span id="status-badge">CHƯA BẬT CAMERA</span>
        </div>
        <!-- Toggle auto mode -->
        <label class="auto-toggle" id="auto-toggle-wrap" style="display:none;">
            <input type="checkbox" id="auto-mode-chk" onchange="toggleAutoMode(this.checked)">
            <span class="toggle-slider"></span>
            <span class="toggle-label">TỰ ĐỘNG</span>
        </label>
    </div>
</div>

<div class="main-container">

    <!-- CỘT CAMERA -->
    <div class="camera-section">
        <!-- Motion indicator -->
        <div class="motion-bar" id="motion-bar" style="display:none;">
            <span class="motion-label">CHUYỂN ĐỘNG</span>
            <div class="motion-track"><div class="motion-fill" id="motion-fill"></div></div>
            <span class="motion-pct" id="motion-pct">0%</span>
        </div>

        <div class="camera-wrapper" id="webcam-container"></div>

        <!-- Confidence bars realtime -->
        <div class="confidence-panel" id="confidence-panel" style="display:none;">
            <p class="conf-label">ĐỘ TIN CẬY REALTIME</p>
            <div id="conf-bars"></div>
        </div>

        <div class="btn-container">
            <button class="btn btn-start" id="start-btn" onclick="init()">
                📷 Bật Camera & AI
            </button>
            <button class="btn btn-scan" id="scan-btn" onclick="scanTrash()" style="display:none;">
                🎯 NHẬN DIỆN RÁC
            </button>
            <button class="btn btn-reset" id="reset-btn" onclick="resetStats()" style="display:none;" title="Reset">🔄</button>
        </div>

        <!-- Popup kết quả + QR -->
        <div id="result-popup">
            <button class="popup-close" onclick="closePopup()">✕</button>
            <div class="popup-left">
                <div class="popup-icon" id="popup-icon">♻️</div>
                <h1 id="res-name">RÁC NHỰA</h1>
                <p id="res-action">Bỏ thùng vàng</p>
                <div class="conf-badge" id="conf-badge">95%</div>
                <p class="wiki-hint">📖 Quét QR để xem thêm</p>
            </div>
            <div class="popup-right">
                <p class="qr-label">WIKIPEDIA</p>
                <div id="qr-code"></div>
                <p class="qr-url" id="qr-url"></p>
            </div>
        </div>
    </div>

    <!-- CỘT THỐNG KÊ -->
    <div class="stats-section">
        <h2>📊 THỐNG KÊ</h2>
        <div id="stats-list"></div>

        <div class="history-box">
            <h3>🕓 Lần scan gần nhất</h3>
            <ul id="history-list">
                <li class="history-empty">Chưa có dữ liệu</li>
            </ul>
        </div>

        <div class="total-box">
            <h3>TỔNG CỘNG</h3>
            <span id="total-count">0</span>
            <p>lượt nhận diện</p>
        </div>
    </div>

</div>

<script src="script.js"></script>
</body>
</html>
