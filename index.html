<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartBin Pro - AIoT PTIT</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --primary: #10b981;
            --secondary: #3b82f6;
            --danger: #ef4444;
            --bg: #0f172a;
            --glass: rgba(255, 255, 255, 0.1);
        }

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            color: white;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .header {
            padding: 30px 0;
            text-align: center;
        }

        .header h1 {
            font-size: 2.5rem;
            margin: 0;
            background: linear-gradient(to right, #10b981, #3b82f6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -1px;
        }

        .main-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 30px;
            padding: 20px;
            max-width: 1200px;
        }

        /* Khung Camera Pro */
        .camera-section {
            position: relative;
            width: 500px;
            height: 500px;
            border-radius: 24px;
            overflow: hidden;
            box-shadow: 0 0 50px rgba(0,0,0,0.5);
            border: 2px solid var(--glass);
        }

        #webcam-container {
            width: 100%;
            height: 100%;
        }

        /* Khung quét ghim vào rác */
        .scan-overlay {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 280px;
            height: 280px;
            border: 2px dashed rgba(255,255,255,0.5);
            border-radius: 20px;
            pointer-events: none;
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            align-items: center;
            padding-bottom: 20px;
        }

        .scan-overlay.active {
            border: 4px solid var(--primary);
            box-shadow: 0 0 20px var(--primary);
            width: 300px;
            height: 300px;
        }

        .label-tag {
            background: var(--primary);
            color: white;
            padding: 8px 16px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 14px;
            transform: translateY(40px);
            opacity: 0;
            transition: 0.3s;
            white-space: nowrap;
        }

        .active .label-tag {
            opacity: 1;
            transform: translateY(10px);
        }

        /* Panel thông tin */
        .info-panel {
            width: 400px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .card {
            background: var(--glass);
            backdrop-filter: blur(10px);
            padding: 20px;
            border-radius: 20px;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .instruction-box {
            border-left: 4px solid var(--secondary);
            padding-left: 15px;
        }

        .instruction-text {
            font-size: 1.1rem;
            line-height: 1.6;
            color: #cbd5e1;
        }

        .stat-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .stat-item {
            background: rgba(0,0,0,0.2);
            padding: 15px;
            border-radius: 12px;
            text-align: center;
        }

        .stat-item span {
            display: block;
            font-size: 1.5rem;
            font-weight: bold;
            color: var(--primary);
        }

        .btn-start {
            background: linear-gradient(to right, #10b981, #059669);
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 1.2rem;
            border-radius: 50px;
            cursor: pointer;
            font-weight: bold;
            box-shadow: 0 10px 20px rgba(16, 185, 129, 0.3);
            transition: 0.3s;
        }

        .btn-start:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 25px rgba(16, 185, 129, 0.4);
        }

        /* Hiệu ứng quét line */
        .scan-line {
            position: absolute;
            width: 100%;
            height: 2px;
            background: var(--primary);
            box-shadow: 0 0 15px var(--primary);
            top: 0;
            animation: scan 2s infinite linear;
        }

        @keyframes scan {
            0% { top: 0; }
            100% { top: 100%; }
        }
    </style>
</head>
<body>

    <div class="header">
        <h1><i class="fas fa-robot"></i> SMART BIN AIoT</h1>
        <p style="color: #94a3b8">Hệ thống phân loại rác thải bằng Trí tuệ nhân tạo</p>
    </div>

    <button class="btn-start" onclick="init()">KÍCH HOẠT HỆ THỐNG</button>

    <div class="main-container">
        <div class="camera-section">
            <div id="webcam-container"></div>
            <div class="scan-overlay" id="overlay">
                <div class="scan-line"></div>
                <div class="label-tag" id="floating-label">Đang phân tích...</div>
            </div>
        </div>

        <div class="info-panel">
            <div class="card instruction-box">
                <h3 style="margin-top:0"><i class="fas fa-info-circle"></i> HƯỚNG DẪN XỬ LÝ</h3>
                <div id="handling-desc" class="instruction-text">
                    Vui lòng đưa rác vào khung quét để hệ thống nhận diện...
                </div>
            </div>

            <div class="card">
                <h3 style="margin-top:0"><i class="fas fa-chart-bar"></i> THỐNG KÊ RÁC</h3>
                <div class="stat-grid">
                    <div class="stat-item">Nhựa <span id="stat-nhua">0</span></div>
                    <div class="stat-item">Giấy <span id="stat-giay">0</span></div>
                    <div class="stat-item">Kim loại <span id="stat-kimloai">0</span></div>
                    <div class="stat-item">Nguy hại <span id="stat-nguyhai">0</span></div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest/dist/tf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@latest/dist/teachablemachine-image.min.js"></script>

    <script>
        // THAY LINK MODEL CỦA BẠN VÀO ĐÂY
        const URL = "https://teachablemachine.withgoogle.com/models/LINK_CUA_BAN_O_DAY/";

        let model, webcam, maxPredictions;
        let lastSpokenClass = "";
        let stats = { "Nhựa": 0, "Giấy": 0, "Kim loại": 0, "Nguy hại": 0 };

        const handlingInstructions = {
            "nhựa": "Đây là rác NHỰA. Cách xử lý: Súc sạch bằng nước, ép bẹp để tiết kiệm diện tích và bỏ vào thùng VÀNG.",
            "giấy": "Đây là GIẤY/CARTON. Cách xử lý: Giữ khô ráo, tháo bỏ băng dính bám trên bề mặt và bỏ vào thùng XANH DƯƠNG.",
            "kim loại": "Đây là KIM LOẠI. Cách xử lý: Làm sạch thức ăn thừa bên trong, không để đọng nước và bỏ vào thùng VÀNG.",
            "nguy hại": "CẢNH BÁO RÁC NGUY HẠI! Cách xử lý: Không vứt chung với rác thường, hãy gói kỹ và đưa đến điểm thu gom pin/điện tử tập trung.",
            "background": "Vui lòng đưa rác vào khung quét để hệ thống nhận diện..."
        };

        async function init() {
            document.querySelector('.btn-start').style.display = 'none';
            model = await tmImage.load(URL + "model.json", URL + "metadata.json");
            maxPredictions = model.getTotalClasses();

            webcam = new tmImage.Webcam(500, 500, true);
            await webcam.setup();
            await webcam.play();
            window.requestAnimationFrame(loop);

            document.getElementById("webcam-container").appendChild(webcam.canvas);
        }

        async function loop() {
            webcam.update();
            await predict();
            window.requestAnimationFrame(loop);
        }

        async function predict() {
            const prediction = await model.predict(webcam.canvas);
            let highestProb = 0;
            let bestClass = "";

            for (let i = 0; i < maxPredictions; i++) {
                if (prediction[i].probability > highestProb) {
                    highestProb = prediction[i].probability;
                    bestClass = prediction[i].className;
                }
            }

            const overlay = document.getElementById("overlay");
            const label = document.getElementById("floating-label");
            const desc = document.getElementById("handling-desc");

            if (highestProb > 0.85 && bestClass !== "Background") {
                overlay.classList.add("active");
                label.innerText = bestClass.toUpperCase() + " (" + Math.round(highestProb*100) + "%)";
                
                // Hiển thị miêu tả cách xử lý
                let key = bestClass.toLowerCase();
                for (let type in handlingInstructions) {
                    if (key.includes(type)) {
                        desc.innerText = handlingInstructions[type];
                        break;
                    }
                }

                if (bestClass !== lastSpokenClass) {
                    speak(desc.innerText);
                    updateStats(bestClass);
                    lastSpokenClass = bestClass;
                }
            } else {
                overlay.classList.remove("active");
                desc.innerText = handlingInstructions["background"];
                lastSpokenClass = "Background";
            }
        }

        function speak(text) {
            window.speechSynthesis.cancel(); // Ngắt câu trước đó
            let speech = new SpeechSynthesisUtterance(text);
            speech.lang = "vi-VN";
            speech.rate = 1.0;
            window.speechSynthesis.speak(speech);
        }

        function updateStats(className) {
            let key = className.toLowerCase();
            if (key.includes("nhựa")) stats["Nhựa"]++;
            else if (key.includes("giấy")) stats["Giấy"]++;
            else if (key.includes("kim loại")) stats["Kim loại"]++;
            else if (key.includes("nguy hại") || key.includes("pin")) stats["Nguy hại"]++;

            document.getElementById("stat-nhua").innerText = stats["Nhựa"];
            document.getElementById("stat-giay").innerText = stats["Giấy"];
            document.getElementById("stat-kimloai").innerText = stats["Kim loại"];
            document.getElementById("stat-nguyhai").innerText = stats["Nguy hại"];
        }
    </script>
</body>
</html>
